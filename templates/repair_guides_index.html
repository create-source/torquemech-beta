{% extends "layout.html" %}

{% block content %}

<section class="tm-section">
  <div class="tm-card">
    <h1>TorqueMech Repair Guides</h1>
    <p>Browse common repair procedures and estimate workflows.</p>
  </div>
</section>

<section class="tm-section">
  <div class="tm-card">

    <ul class="tm-list">
      {% for guide in guides %}
      <li>
        <a href="/repair-guides/{{ guide.slug }}">
          {{ guide.title }}
        </a>
      </li>
      {% endfor %}
    </ul>

  </div>
</section>

{% endblock %}
