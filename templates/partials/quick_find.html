<section class="tm-section">
  <div class="tm-card tm-quick-find" data-quick-find>
    <div class="tm-eyebrow">TorqueMech Quick Find</div>
    <h2 class="tm-quick-find__title">Search Codes, Costs, Symptoms, and Guides</h2>
    <p class="tm-muted tm-quick-find__copy">
      Try an OBD code like <strong>P0420</strong> or a repair term like <strong>alternator</strong> or <strong>oxygen sensor</strong>.
    </p>

    <form class="tm-quick-find__form" action="#" method="get" novalidate>
      <label class="tm-quick-find__label" for="tmQuickFindInput">Quick Find</label>
      <div class="tm-quick-find__controls">
        <input
          id="tmQuickFindInput"
          class="tm-quick-find__input"
          type="search"
          placeholder="Search P0420, alternator, oxygen sensor, rough idle..."
          autocomplete="off"
          spellcheck="false"
        />
        <button class="tm-btn tm-btn-primary tm-quick-find__button" type="submit">Go</button>
      </div>
    </form>

    <p class="tm-quick-find__hint">
      Matches OBD codes, repair cost guides, symptom pages, and repair guides.
    </p>
    <p class="tm-quick-find__empty tm-muted" data-quick-find-empty hidden>No matching pages found yet. Try a shorter term or an exact code.</p>

    <div class="tm-quick-find__results" data-quick-find-results hidden></div>
    <script type="application/json" data-quick-find-index>{{ quick_find_items | tojson }}</script>
  </div>
</section>
