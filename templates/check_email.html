{% extends "layout.html" %}

{% block title %}Check Your Email | TorqueMech{% endblock %}

{% block page_css %}
<style>
  body { background:#09111d; }
  .tm-auth-page { display:grid; place-items:center; min-height:calc(100vh - 170px); padding:34px 0; }
  .tm-auth-panel { width:min(100%, 500px); border:1px solid rgba(255,255,255,.12); border-radius:8px; background:#111827; color:#e5edf7; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,.28); }
  .tm-auth-panel h1 { color:#f8fafc; font-size:2rem; letter-spacing:0; }
  .tm-auth-panel p { color:#a9b6c8; }
  .tm-auth-actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:20px; }
  .tm-auth-primary { border:0; border-radius:8px; background:#f97316; color:#111827; cursor:pointer; font-weight:900; padding:12px 16px; }
</style>
{% endblock %}

{% block content %}
<section class="tm-auth-page">
  <div class="tm-auth-panel">
    <h1>Check your email</h1>
    <p>Your TorqueMech account must be verified before you can continue to your Pro workspace.</p>
    <form class="tm-auth-actions" method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="tm-auth-primary" type="submit">Log Out</button>
    </form>
  </div>
</section>
{% endblock %}
